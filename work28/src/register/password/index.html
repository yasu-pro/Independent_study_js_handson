<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>register</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/destyle.css@1.0.15/destyle.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script defer type="module" src="./js/index.js"></script>
  </head>
  <body>
    <div class="form_wrap">
      <div class="form_head">
        <h1 class="title">新規パスワード入力</h1>
      </div>

      <div class="form_area">
        <div class="form_area-input">
          <div class="userPassword">
            <label for="password">パスワード</label>
            <div class="columnBox">
              <input type="text" name="password" id="password" required />
              <p class="invalidError password">
                ※8文字以上の大小の英数字を交ぜたものにしてください。
              </p>
            </div>
          </div>
          <div class="userConfirmPassword">
            <label for="confirmPassword"> 確認用パスワード</label>
            <div class="columnBox">
              <input
                type="text"
                name="confirmPassword"
                id="confirmPassword"
                required
              />
              <p class="invalidError confirmPassword charError">
                ※8文字以上の大小の英数字を交ぜたものにしてください。
              </p>
              <p class="invalidError confirmPassword notMatchError">
                ※入力されたパスワードと一致したものを入力してください
              </p>
            </div>
          </div>
        </div>
        <div class="submit">
          <button class="submitBtn" id="js-submitBtn" type="submit" disabled>
            送信
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
